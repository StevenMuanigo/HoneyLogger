version: '3.8'

services:
  # Elasticsearch - Log storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: honeylogger-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - honeylogger-network

  # Kibana - Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: honeylogger-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - honeylogger-network

  # Redis - Session & cache (optional)
  redis:
    image: redis:7-alpine
    container_name: honeylogger-redis
    ports:
      - "6379:6379"
    networks:
      - honeylogger-network

  # HoneyLogger - Main application
  honeylogger:
    build: .
    container_name: honeylogger-app
    ports:
      - "8080:8080"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis:6379
    depends_on:
      - elasticsearch
      - redis
    networks:
      - honeylogger-network
    restart: unless-stopped

networks:
  honeylogger-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
